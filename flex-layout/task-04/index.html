<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squid Game Landing page</title>
    <link rel="stylesheet" href="index.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
<main>
    <section class="hero">
        <div class="main-section">
            <img src="./mainimg.png" alt="">
        </div>
        <header class="navbar">
            <div class="logo">
                <img src="https://raw.githubusercontent.com/nikush1/public/4e17c2bb5c87ddeed86f17891cd9632e99977121/original-a776538c6d5bedc7eb58c5977b9bd1df.gif" alt="" height="30">
            </div>
            <div class="nav-links">
                <p>About</p>
                <p>Watch now</p>
                <p>Actors</p>
                <p>Contact</p>
            </div>
            <div class="side-menu">
                <i class="ri-menu-3-fill"></i>
            </div>
        </header>
        <div class="hero-content">
            <img src="./squidgame.png" alt="">
             <p> Action/ Thriller/ Drama series directed by Dong-hyuk Hwang <br>
            Season1: 9 Episodes</p>
        </div>
        <div class="button">
            <button id="orange-btn"><span><i class="ri-play-fill"></i></span>Play Now</button>
            <button id="pink-btn"><span><i class="ri-play-mini-line"></i></span>Watch Trailer</button>
        </div>
        <div class="social-icons">
            <i class="ri-twitter-line"></i>
            <i class="ri-instagram-line"></i>
            <i class="ri-facebook-fill"></i>
        </div>
        <div class="movie-cards">
            <div class="cards">
               <img src="https://i.pinimg.com/originals/69/99/67/69996781152f911455f02e13b1b27a1c.png" alt="">
               <i id="play-btn" class="ri-play-fill"></i>
            </div>
            <div class="cards">
                <img src="https://i.ytimg.com/vi/ZuavWOD_9tY/sddefault.jpg" alt="">
                <i id="play-btn" class="ri-play-fill"></i>
            </div>
            <div class="cards">
                <img src="https://down-br.img.susercontent.com/file/br-11134207-7qukw-lhbe1izlqp4m7c" alt="">
                <i id="play-btn" class="ri-play-fill"></i>
            </div>
        </div>

    </section>
</main>
    
</body>
</html>
